(function(root){
function clean(raw){const a={...raw};if(a.region!=='ru')for(const k of ['avito','analysis','demand','mismatch','vk'])delete a[k];if(a.stage==='none')for(const k of ['sales','responder','numbers','base','economy','mismatch','restore']){if(a.inquiries==='yes'&&['sales','responder'].includes(k))continue;delete a[k];}if(['none',undefined,'unknown'].includes(a.avito))for(const k of ['analysis','demand','mismatch'])delete a[k];if(a.format==='home'&&a.maps_existing!==true)delete a.maps;return a;}
function conflicts(a){const issues=[];if(a.stage==='none'&&((a.orders||0)>0||a.avito==='orders'||a.vk==='orders'))issues.push('Вы отметили, что заказов ещё не было, но указали оплаченные заказы. Что нужно исправить?');if((a.orders||0)<0||(a.leads||0)<0)issues.push('Количество обращений и заказов не может быть отрицательным. Проверьте числа.');if((a.orders||0)>(a.leads??Infinity))issues.push('Заказов больше, чем записанных обращений. Часть людей написала раньше или учтены не все обращения?');return issues;}
function route(raw){const a=clean(raw),q=['region','stage','format','product','goal','channels','change'];if(!['studio','shop'].includes(a.format))q.push('maps_existing');if(a.stage==='none'){q.push('inquiries');if(a.inquiries==='yes')q.push('sales','responder');}else if(a.stage)q.push('numbers','sales','responder','economy','base','restore');if(a.region==='ru'){q.push('avito');if(!['none',undefined,'unknown'].includes(a.avito)){q.push('analysis','demand');if(['leads','orders','past'].includes(a.avito))q.push('mismatch');}}if(['studio','shop'].includes(a.format)||a.maps_existing===true)q.push('maps');if(a.region==='ru')q.push('vk');q.push('ready','time','capacity','budget','access','note');return q;}
function choose(raw){const issues=conflicts(raw);if(issues.length)return {issues,questions:route(raw),modules:[]};const a=clean(raw),mods=[],add=m=>{if(!mods.includes(m))mods.push(m)};if(['overload','pause'].includes(a.capacity)||a.time==='none')add('capacity');if(a.economy==='loss')add('economy');if(['no','partial','photos'].includes(a.ready))add('prep');if(a.restore==='yes')add('restore');if(a.mismatch==='yes')add('avito_fix');if(['poor','late'].includes(a.sales))add('sales');if(['poor','late'].includes(a.sales)&&a.base==='poor')add('base');if(a.time==='little'&&['active','unused','poor'].includes(a.base))add('base');if((['studio','shop'].includes(a.format)||a.maps_existing===true)&&['none','stale','wrong'].includes(a.maps))add('maps');if(a.region==='foreign')add('foreign');else if(a.region==='ru'){if(a.demand==='weak')add(a.budget==='yes'?'vk':'local');else if(a.access==='blocked')add('local');else if(a.mismatch!=='yes')add(a.avito==='orders'&&a.analysis==='done'?'avito_work':'avito');if(a.budget==='no')add('local');}else add('records');if(a.maps==='wrong')add('maps');if(['active','unused','poor'].includes(a.base))add('base');if(a.vk==='orders')add('vk');if(a.stage!=='none'&&a.numbers==='unknown')add('records');const allowed=a.budget==='yes'&&['room','part'].includes(a.capacity)&&['yes','little'].includes(a.time)&&a.ready==='yes'&&a.access==='ok'&&a.economy!=='loss'&&!['poor','late'].includes(a.sales)&&a.region==='ru'&&!['yes','maybe'].includes(a.change)&&!a.note;const gaps=[];for(const [k,label]of [['region','город и страна'],['budget','бюджет'],['capacity','возможность взять дополнительные заказы'],['ready','готовность работ и условий'],['time','время на продвижение']])if([undefined,'unknown'].includes(a[k]))gaps.push(label);return {answers:a,questions:route(a),modules:mods,paid_candidate:allowed,gaps,issues:[]};}

function question(){const keys=Engine.route(answers),i=Math.max(0,keys.indexOf(current));if(!Q[current])current=keys[0];const k=current;let fields='';if(k==='region')fields=`<label class="field"><span>Город и страна</span><input id="extra" maxlength="100" value="${esc(answers.city)}" placeholder="Например, Казань, Россия"></label>`;if(k==='goal')fields=`<label class="field"><span>Можно написать своими словами</span><textarea id="custom-goal" maxlength="500" placeholder="Что хотелось бы изменить?">${esc(answers.goal&&!Q.goal[1].includes(answers.goal)?answers.goal:'')}</textarea></label>`;if(k==='numbers')fields=`<div class="numbers-fields"><label class="field"><span>Обращений</span><input id="leads" type="number" min="0" step="1" value="${esc(answers.leads)}"></label><label class="field"><span>Оплаченных заказов</span><input id="orders" type="number" min="0" step="1" value="${esc(answers.orders)}"></label></div><p class="support-note">Возьмите один полный месяц. Если не считали, оставьте поля пустыми.</p>`;if(k==='budget')fields=`<div class="numbers-fields"><label class="field"><span>Сумма на месяц, если знаете</span><input id="budget_amount" type="number" min="0" value="${esc(answers.budget_amount)}"></label><label class="field"><span>Валюта</span><input id="currency" maxlength="12" value="${esc(answers.currency||'₽')}"></label></div>`;if(k==='note')fields=`<label class="field"><span>Например, планируете переезд или можете брать заказы только по выходным</span><textarea id="note" maxlength="1500" placeholder="Что важно знать о вашей работе?">${esc(answers.note)}</textarea></label>`;const group=['region','stage','format','product','goal','channels','change'].includes(k)?'Ваша ситуация':['time','capacity','budget','access','note','ready'].includes(k)?'Время и возможности':'Что уже пробовали';return `<div class="progress" role="progressbar" aria-label="Пройдено вопросов" aria-valuenow="${i}" aria-valuemin="0" aria-valuemax="${keys.length}"><div style="width:${i/keys.length*100}%"></div></div><div class="wrap narrow question"><div class="question-top"><button class="quiet" data-back>Назад</button><span>${i+1} из ${keys.length}</span></div><p class="eyebrow">${group}</p><h1>${esc(Q[k][0])}</h1>${k==='channels'?'<p class="muted">Можно выбрать несколько вариантов.</p>':''}${k==='note'?'':options(k,k==='channels')}${fields}<p class="error" id="question-error" role="alert"></p><div class="actions"><button class="quiet" data-skip>${k==='note'?'Больше ничего':'Пока не знаю'}</button><button class="primary" data-next>${editing?'Сохранить ответ':'Дальше'}</button></div></div>`;}
function review(){const issues=Engine.conflicts(answers);return `<div class="wrap narrow"><button class="quiet" data-last>Вернуться к вопросам</button><section class="paper form-card"><p class="eyebrow">Перед тем как составить план</p><h1>Всё верно поняли?</h1><p>Посмотрите, ничего ли не упустили. Любой ответ можно исправить.</p>${issues.length?`<div class="error" role="alert">${issues.map(x=>'<p>'+esc(x)+'</p>').join('')}</div>`:''}<div class="review-list">${reviewRows()}</div><button class="primary" data-go="result" ${issues.length?'disabled':''}>Да, показать мой план</button></section></div>`;}
function chosen(){const r=Engine.choose(answers),mods=r.modules;let active=mods.slice(0,2);if(mods[0]==='capacity')active=mods.filter(x=>['capacity','sales'].includes(x));if(answers.time==='little'||(mods[0]==='prep'&&answers.ready==='no'))active=active.slice(0,1);const later=mods.filter(x=>!active.includes(x));return {...r,active,later};}
function facts(a){const f=[];if(a.city)f.push('Вы работаете в городе '+a.city+'.');if(a.stage==='none')f.push('Оплаченных заказов пока не было.');else if(a.leads!==undefined)f.push(`За указанный месяц обращений: ${a.leads}; оплаченных заказов: ${a.orders??'не указано'}.`);
const statements={avito:{none:'Авито ещё не использовали.',no_views:'У объявления на Авито почти нет просмотров.',views:'Объявление смотрят, но почти не пишут.',leads:'С Авито пишут, но редко покупают.',orders:'С Авито уже есть заказы.',past:'Раньше Авито приводило заказы, сейчас результат изменился.'},sales:{good:'После переписки обычно договариваетесь о заказе и оплате.',poor:'Люди пишут, но разговор часто заканчивается без заказа.',late:'Не успеваете отвечать покупателям.',conditions:'Часть заказов не получается принять из-за даты или доставки.'},base:{none:'Контакты покупателей пока не собирали.',unused:'Контакты прежних покупателей есть, но сейчас им не пишете.',active:'Пишете прежним покупателям, после этого есть заказы.',poor:'Пишете прежним покупателям, но они почти не отвечают.'},ready:{yes:'Фотографии и цены готовы. Понятно, как оплатить и получить заказ.',partial:'Работы есть, но ещё не всё решили с ценами, оплатой или доставкой.',photos:'Собирать умеете, но фотографий для объявления пока нет.',no:'Пока нет работ, которые сможете повторить для покупателя.'},time:{yes:'Есть время заниматься продвижением.',little:'На продвижение остаётся мало времени.',none:'В ближайший месяц заниматься продвижением не сможете.'},capacity:{room:'Можете взять новые заказы.',part:'Сможете взять только немного новых заказов.',overload:'Уже не успеваете с текущими заказами.',pause:'В этом месяце планируете перерыв в работе.'}};
for(const [k,opts] of Object.entries(statements))if(opts[a[k]])f.push(opts[a[k]]);if(a.budget==='no')f.push('Сейчас денег на рекламу не выделяете.');if(a.budget==='yes')f.push(a.budget_amount?`На рекламу готовы выделить ${a.budget_amount} ${a.currency||'₽'} за месяц.`:'Готовы выделить деньги на рекламу; сумму пока не указали.');if(a.responder==='staff')f.push('Клиентам отвечает сотрудник.');if(a.product)f.push('Хотите чаще продавать: '+a.product+'.');return f;}
function planModule(k,a=Engine.clean(answers)){
 const m=[...M[k]];
 if(k==='capacity'&&a.capacity==='pause'){
  m[0]='Подготовиться к перерыву в работе';
  m[1]='Вы планируете перерыв. Сначала нужно закончить то, что уже обещали покупателям, и сообщить, когда снова можно будет заказать шары.';
  m[2]='Проверьте уже принятые заказы: что нужно собрать, когда передать и что осталось согласовать с покупателем.\nОтветьте людям, с которыми ещё обсуждаете заказ. Сразу скажите, сможете ли выполнить его к нужному дню.\nУкажите в объявлениях и соцсетях, с какого числа снова принимаете заказы. Если дату пока не знаете, так и напишите.\nПроверьте, какая платная реклама сейчас работает. На время, когда не принимаете заказы, её стоит остановить, чтобы не оплачивать обращения, на которые не сможете ответить заказом.';
  m[3]='Принятые заказы учтены, покупатели знают о перерыве. Вы не тратите деньги на новые обращения в дни, когда не работаете.';
  m[4]='Не обещайте заказ к дате, в которую ещё не уверены. Перед возвращением проверьте цены, доставку и информацию в объявлениях.';
 }
 else if(k==='capacity'&&a.time==='none'&&a.capacity!=='overload'){
  m[0]='Решить, кто сможет заниматься продвижением';
  m[1]='Вы можете принимать заказы, но в ближайший месяц не сможете заниматься продвижением. Поэтому сначала нужно решить, кто будет проверять рекламу и отвечать на новые обращения.';
  m[2]='Посмотрите, откуда уже приходят покупатели. Запишите, что нужно делать, чтобы продолжать принимать эти заказы.\nРешите, кто сможет отвечать на сообщения, обновлять цены и проверять расходы на рекламу. Если помощник есть, обсудите с ним эти задачи.\nЕсли передать работу некому, отложите новые запуски. Не нужно оплачивать рекламу, которую весь месяц некому проверять.\nВыберите время, когда сможете вернуться к продвижению. Перед запуском снова проверьте фотографии, цены и возможность принимать заказы.';
  m[3]='Вы решили, кто будет заниматься рекламой и обращениями. Если сейчас это некому поручить, новые запуски отложены до вашего возвращения.';
 }
 if(k==='prep'&&a.ready==='no'){
  m[0]='Выбрать композиции и научиться их повторять';
  m[1]='Пока нет работ, которые вы сможете повторить для клиента. Сначала нужно разобраться со сборкой и расходами, чтобы обещать покупателю именно то, что сможете сделать.';
  m[2]='Выберите композиции, с которых хотите начать. Пока берите те, которые сможете освоить и собрать из доступных вам материалов.\nСоберите их для практики. Проверьте, получается ли повторить результат и сколько времени занимает сборка.\nЗапишите расход шаров и других материалов, упаковку и доставку. На этой основе определите цену, а не копируйте её у другого продавца.\nКогда сможете повторить работу, подготовьте фотографии и описание заказа. Можно снять свою композицию или купить контент с теми наборами, которые уже умеете собирать.';
  m[3]='Вы знаете, какие композиции готовы выполнять для клиента, сколько они стоят и как показать их покупателю. Если сборка ещё не получается, сначала продолжаете практику.';
  m[5]='Курс по маркетингу поможет показать готовые композиции в объявлениях и найти покупателей. Сборку нужно освоить отдельно: реклама не заменяет умения выполнить заказ.';
 }
 if(k==='maps'&&a.maps==='none'){
  m[0]='Подготовить карточку своей точки на картах';
  m[2]='Проверьте, нет ли уже карточки вашей точки. Если есть, сначала разберитесь с доступом к ней, чтобы не создавать вторую.\nПодготовьте адрес, телефон и часы работы. Укажите, можно ли прийти без записи или нужно заранее договориться.\nДобавьте фотографии композиций, состав и цены. Напишите, как оформить заказ, забрать его или заказать доставку.\nПосле размещения откройте карточку как покупатель. Проверьте адрес и способ связи, затем отмечайте, кто нашёл вас на картах и что заказал.';
 }
 if(k==='vk'&&a.vk==='none')m[2]='Создайте сообщество: укажите, что продаёте шары, в каком городе работаете и как вам написать.\nДобавьте товары: фотографии, состав и цены композиций, которые хотите продавать.\nУкажите доставку и самовывоз. Проверьте сообщения сообщества и решите, кто будет отвечать покупателям.\nПеред рекламой выберите, какой набор показывать первым. Проверьте, что человек сможет перейти к нему, узнать цену и написать вам.';
 if(k==='base'&&a.base==='poor'){
  m[0]='Разобраться, почему прежние покупатели не отвечают';
  m[1]='Вы уже пишете прежним покупателям, но откликов мало. Сначала разберите отправленные сообщения, прежде чем писать ещё большему числу людей.';
  m[2]='Откройте последние сообщения прежним покупателям. Отметьте, кому писали, по какому поводу и был ли ответ.\nПроверьте, подходил ли повод именно этому человеку. Например, напоминание о дне рождения полезнее, когда вы знаете дату прошлого заказа.\nПосмотрите, понятно ли из сообщения, какой набор можно заказать, сколько он стоит и что нужно сделать дальше. Исправьте то, чего не хватает.\nОтправьте исправленное сообщение тем, кому оно сейчас подходит. Запишите ответы и оплаты; тем, кто не отвечает, не повторяйте одно и то же.';
 }
 if(k==='avito'&&a.budget==='no')m[2]=m[2].replace('Перед оплатой продвижения решите, сколько готовы потратить на проверку. Записывайте, сколько людей написали с этого объявления и сколько оплатили заказ.','Сейчас денег на рекламу нет, поэтому подготовьте объявление и проверьте стоимость размещения. Если оно требует оплаты, сохраните текст и фотографии до появления бюджета. Для поиска покупателей без рекламных расходов дальше разберите сотрудничества.');
 return m;
}

function secondWeek(r){
 const a=r.answers,main=r.modules[0];
 if(main==='capacity')return '<h3>'+esc(a.capacity==='pause'?'Проверьте, все ли знают о перерыве':a.time==='none'&&a.capacity!=='overload'?'Проверьте договорённость о помощи':'Проверьте, стали ли успевать с заказами')+'</h3><p>'+esc(a.capacity==='pause'?'Проверьте объявления и незаконченные переписки. Покупатели должны знать, какие заказы вы ещё выполните и когда снова начнёте работать. Если дата возвращения меняется, поправьте её везде.':'Если договорились о помощи, посмотрите первые результаты вместе: кто отвечает людям, записывает заказы и проверяет рекламу. Если помощника нет, не добавляйте новые рекламные задачи, пока на них не появится время.')+'</p>';
 if(main==='prep'&&a.ready==='no')return '<h3>Проверьте, готовы ли принять заказ</h3><p>Получается ли повторить выбранную композицию? Понятна ли цена с учётом материалов и доставки? Если да, переходите к фотографиям и объявлению. Если нет, продолжайте практику: сроки следующих шагов сдвигаются.</p>';
 if(r.later[0])return '<p>Переходите сюда, когда закончите начатое. Если первое задание ещё не готово, продолжайте его.</p>'+task(r.later[0]);

окупателям.',restore:'Разберите с Аней, откуда раньше приходили заказы. Затем откройте уроки по этой площадке и исправьте то, что изменилось за время перерыва.',economy:'По уроку об отчёте запишите расходы на рекламу и оплаченные заказы. Вместе с Аней посмотрите, что осталось после расходов.',records:'По уроку об отчёте соберите обращения, оплаченные заказы и расходы на рекламу. С этими цифрами приходите на разбор.'}[k];}
function paymentNote(r){const a=r.answers;if(r.paid_candidate)return 'Когда объявление или сообщество готово, выберите одну площадку для рекламы. Запишите сумму, которую готовы потратить, и считайте обращения и оплаты. Не увеличивайте расходы, пока не разобрались с первым результатом.';const why=[];if(a.capacity==='overload'||(a.time==='none'&&a.capacity!=='pause'))why.push('сначала решите, кто будет отвечать покупателям и выполнять заказы');else if(a.capacity==='pause')why.push('сначала решите, с какого числа снова будете принимать заказы');if(a.ready==='partial')why.push('укажите цены, оплату, доставку и самовывоз рядом с фотографиями');if(a.ready==='photos')why.push('подготовьте фотографии композиций, которые сможете повторить');if(a.ready==='no')why.push('сначала научитесь выполнять те композиции, которые хотите продавать');if(['poor','late'].includes(a.sales))why.push('разберите переписки, которые не закончились заказом');if(a.economy==='loss')why.push('посчитайте, сколько остаётся после рекламы и выполнения заказов');if(a.budget==='no')why.push('сейчас вы не выделяете на неё деньги');if(a.budget==='unknown'||a.budget===undefined)why.push('решите, сколько денег готовы потратить');if(a.access==='blocked')why.push('выясните, что мешает разместить рекламу');else if(a.access!=='ok')why.push('проверьте доступ к аккаунту и оплате рекламы');if(a.note)why.push('учтите своё дополнение к ответам');return 'Платную рекламу пока не добавляйте: '+(why.length?why.join('; '):'перед оплатой проверьте фотографии, цены, доставку и возможность брать новые заказы')+'.';}

function result(){const r=chosen();if(r.issues.length)return review();const a=r.answers,main=r.modules[0],next=r.later[0],later=main==='capacity'?r.later:r.later.slice(1),goal=a.goal&&a.goal!=='unknown'?a.goal:'Понять, с чего начать продвижение';const pointB=r.active.map(k=>planModule(k,a)[3]);const paid=paymentNote(r);return `<div class="wrap result"><div class="result-title"><p class="eyebrow">${person.name?esc(person.name)+', ваш':'Ваш'} план готов</p><h1>Ваша стратегия<br><span class="yellow-text">на 30 дней</span></h1><p class="lead">Ваша цель: ${esc(goal)}.</p></div><nav class="result-nav" aria-label="Разделы плана"><a href="#points">Откуда начинаем</a><a href="#plan">План на 30 дней</a><a href="#course">Путь на курсе</a></nav><div class="ab-grid" id="points"><article class="point dark"><span class="point-tag"><b>А</b>Сейчас</span><h3>Что у вас есть</h3><ul>${facts(a).map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></article><article class="point paper"><span class="point-tag"><b>Б</b>За ближайший месяц</span><h3>К чему идём</h3>${pointB.map(x=>'<p>'+esc(x)+'</p>').join('')}<p class="muted">Это то, что вы сможете сделать и проверить за месяц. Количество новых заказов будет зависеть от спроса, рекламы и того, как проходят разговоры с покупателями.</p></article></div><div class="main-insight"><span class="star" aria-hidden="true">✳</span><div><p class="eyebrow">С чего начать и почему</p><h2>${esc(planModule(main,a)[0])}</h2><p>${esc(planModule(main,a)[1])}</p></div></div>${r.gaps.length?`<p class="support-note">Пока нужно уточнить: ${esc(r.gaps.map(x=>x==='готовность работ и условий'?'есть ли фотографии, цены и понятный способ заказа':x).join(', '))}. Эти ответы нужны, чтобы решить, можно ли уже оплачивать рекламу.</p>`:''}${a.note?`<div class="note-box" style="margin-top:24px"><strong>Вы добавили:</strong> ${esc(a.note)}<p>Перед запуском нужно уточнить, как это влияет на даты, место работы и возможность принимать заказы.</p></div>`:''}${['yes','maybe'].includes(a.change)?'<p class="note-box">Вы планируете смену города или адреса. Перед продвижением определите, где и с каких дат принимаете заказы; обновите условия доставки.</p>':''}<section class="section" id="plan"><div class="section-heading"><div><p class="eyebrow">Ближайшие 30 дней</p><h2>Что делать<br>по шагам</h2></div><span class="star" aria-hidden="true">✳</span></div><p class="muted">Если на задание понадобится больше времени, сдвигайте следующие. Не нужно успевать всё сразу.</p><div class="route-strip">${r.active.concat(main==='capacity'?[]:r.later.slice(0,1)).map(k=>`<div>${icon(k)}<span>${esc(planModule(k)[0])}</span></div>`).join('')}</div><div class="weeks"><article class="week"><div class="week-period">Дни 1–7<span>Начните с этого</span></div><div class="week-body">${a.time==='little'?'<p>Времени мало — сначала одно задание.</p>':''}${r.active.map(task).join('')}</div></article><article class="week"><div class="week-period">Дни 8–14<span>Следующее действие</span></div><div class="week-body">${secondWeek(r)}<div class="note-box">${paid}</div></div></article><article class="week"><div class="week-period">Дни 15–21<span>Что получилось</span></div><div class="week-body">${checkPlan(r)}</div></article><article class="week"><div class="week-period">Дни 22–30<span>Что продолжать</span></div><div class="week-body"><h3>Сравните начало и конец месяца</h3><p>${esc(monthEnd(a,main))}</p></div></article></div></section><div class="split-notes"><div><h3>Что продолжать</h3><p>${main==='capacity'?'Продолжайте отвечать людям, которые уже нашли вас через объявления или соцсети, и сразу говорите, сможете ли выполнить заказ к дню, который нужен покупателю. Не увеличивайте рекламу и не зовите всех прежних клиентов за новыми покупками, если сейчас не сможете принять их заказы. Если уходите на перерыв, напишите, с какого числа снова принимаете заказы.':a.base==='active'?'Продолжайте работать с базой. Не бросайте то, что уже приводит покупателей, ради новой рекламы.':'После каждого заказа записывайте, кто купил, что выбрал и к какому событию. Если люди уже приходят с Авито, ВК или по рекомендациям, продолжайте отвечать им и показывать новые работы.'}</p></div><div><h3>За что пока не браться</h3><p>Новый сайт и несколько новых рекламных площадок одновременно сейчас не нужны.</p>${later.length?'<p>Позже: '+esc(later.map(k=>M[k][0]).join('; '))+'.</p>':''}</div></div>${courseRoute(r)}<section class="feedback"><p class="eyebrow">Сверимся с вами</p><h2>Похоже на вашу ситуацию?</h2><div class="options">${['Да, похоже','Частично','Не похоже'].map(t=>`<button class="option" data-rating="${t}" aria-pressed="${rating===t}">${t}</button>`).join('')}</div><div id="feedback-response" role="status"></div><div class="download-row"><button class="primary" data-print>Сохранить план в PDF</button><button class="quiet" data-go="review">Исправить ответы</button></div></section></div>`;}
function program(){return `<div class="wrap"><button class="quiet" data-go="result">Вернуться к моему плану</button><section class="program-hero"><p class="eyebrow">Маркетинг с Анной Соловьёвой</p><h1>Больше <span class="yellow-text">заявок</span></h1><p class="lead">Разобраться с Аней, где искать покупателей. По урокам подготовить объявления и настроить рекламу. Посмотреть, откуда пришли обращения и заказы.</p></section><div class="program-banner paper"><span>67</span><div><strong>уроков всего</strong><p>Включая дополнительные. Авито, ВК, Яндекс, сотрудничества, рассылки и отчёты.</p></div></div><section class="section"><div class="section-heading"><h2>Что есть<br>в программе</h2><span class="star" aria-hidden="true">✳</span></div><div class="program-pictures">${[0,1,3].map((n)=>`<button data-program="${n}" aria-label="${esc(courseModules[n][0])} — открыть раздел"><img src="${LOCAL_ASSETS[n+1]}" alt="${esc(courseModules[n][0])}" loading="lazy"></button>`).join('')}</div><div class="program-grid">${courseModules.map(([t,d])=>`<details class="program-item"><summary>${esc(t)}</summary><ul>${d.split('; ').map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`).join('')}</div><div class="note-box program-note">Вы смотрите уроки по той площадке, с которой начинаете. Например, для Авито — анализ конкурентов, объявления и продвижение. На разбор приносите своё объявление, вопросы по настройкам и цифры по рекламе.</div></section><section class="section reviews-slot"><h2>Отзывы учениц</h2>${loonsReviews()}</section><div class="download-row"><button class="primary" data-go="result">Вернуться к моему маршруту</button></div><p class="support-note">Это предварительный просмотр программы. Кнопка записи на курс пока не подключена.</p></div>`;}
function render(){app.innerHTML=({welcome,contact,question,review,result,program}[screen]||welcome)();loonsInitReviews();}
function rememberFields(){for(const k of ['leads','orders','budget_amount']){const el=document.getElementById(k);if(el){if(el.value==='')delete answers[k];else if(Number.isFinite(Number(el.value))&&Number(el.value)>=0)answers[k]=Number(el.value);}}const extra=document.getElementById('extra');if(extra)answers.city=extra.value.trim();const currency=document.getElementById('currency');if(currency)answers.currency=currency.value.trim();}
function next(skip=false){const k=current;for(const key of ['leads','orders','budget_amount']){const el=document.getElementById(key);if(el&&el.value!==''&&(!el.checkValidity()||Number(el.value)<0))return err('Проверьте число: оно не может быть отрицательным или дробным.');}rememberFields();if(k==='note')answers.note=skip?'':document.getElementById('note').value.trim();else if(k==='channels'){answers[k]=skip?['Не знаю']:selected;if(!answers[k].length)return err('Выберите хотя бы один вариант.');}else if(k==='goal'){const custom=document.getElementById('custom-goal')?.value.trim();if(custom&&!skip)answers[k]=custom;else if(skip)answers[k]='Разобраться, с чего начать';else if(!answers[k]||answers[k]==='Своими словами')return err('Выберите цель или напишите своими словами.');}else if(skip)answers[k]='unknown';else if(answers[k]===undefined)return err('Выберите вариант ответа.');if(k==='numbers'&&answers.numbers==='unknown'){delete answers.leads;delete answers.orders;}if(k==='budget'&&answers.budget!=='yes')delete answers.budget_amount;if(k==='numbers'&&((answers.orders??0)>(answers.leads??Infinity)))return err('Заказов больше, чем обращений. Проверьте, что взяли один и тот же период.');if(k==='budget'&&answers.budget==='yes'&&answers.budget_amount===0)return err('Вы указали ноль. Выберите «Пока нет» или исправьте сумму.');answers=Engine.clean(answers);save();if(editing){const missing=Engine.route(answers).find(x=>x!=='note'&&answers[x]===undefined);if(missing){current=missing;selected=[];return go('question');}editing=false;return go('review');}const keys=Engine.route(answers),idx=keys.indexOf(k);if(idx>=keys.length-1)return go('review');current=keys[idx+1];selected=Array.isArray(answers[current])?[...answers[current]]:[];go('question');}
function err(t){document.getElementById('question-error').textContent=t;}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){if(b.dataset.go==='result'&&Engine.conflicts(answers).length)return;go(b.dataset.go);}else if(b.hasAttribute('data-program')){const detail=app.querySelectorAll('.program-item')[Number(b.dataset.program)];detail.open=true;detail.scrollIntoView({behavior:'smooth',block:'center'});detail.querySelector('summary').focus({preventScroll:true});}else if(b.hasAttribute('data-resume')){current=Engine.route(answers).find(k=>answers[k]===undefined)||'note';go('question');}else if(b.hasAttribute('data-option')){const i=Number(b.dataset.option),v=values[current]?.[i]??Q[current][1][i];rememberFields();if(current==='channels'){if(['Заказов пока нет','Не знаю'].includes(v))selected=[v];else {selected=selected.filter(x=>!['Заказов пока нет','Не знаю'].includes(x));selected=selected.includes(v)?selected.filter(x=>x!==v):[...selected,v];}}else {if(current==='stage'&&answers.stage!==v){delete answers.inquiries;delete answers.leads;delete answers.orders;}if(current==='numbers'&&v==='unknown'){delete answers.leads;delete answers.orders;}if(current==='budget'&&v!=='yes')delete answers.budget_amount;answers[current]=v;}render();}else if(b.hasAttribute('data-next'))next();else if(b.hasAttribute('data-skip'))next(true);else if(b.hasAttribute('data-back')){rememberFields();if(editing){editing=false;go('review');return;}const keys=Engine.route(answers),i=keys.indexOf(current);if(i===0)go('contact');else{current=keys[i-1];selected=Array.isArray(answers[current])?[...answers[current]]:[];go('question');}}else if(b.dataset.edit){current=b.dataset.edit;editing=true;selected=Array.isArray(answers[current])?[...answers[current]]:[];go('question');}else if(b.hasAttribute('data-last')){current=Engine.route(answers).at(-1);go('question');}else if(b.hasAttribute('data-print')){app.querySelectorAll('details').forEach(d=>d.open=true);window.print();}else if(b.dataset.rating){rating=b.dataset.rating;app.querySelectorAll('[data-rating]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.rating===rating)));document.getElementById('feedback-response').innerHTML=rating==='Да, похоже'?'<p>Можно сохранить план и вернуться к нему позже.</p>':'<p>Вернитесь к ответам и поправьте то, что не учли. Если ваша ситуация сложнее, её стоит разобрать с Аней лично.</p>';}});
app.addEventListener('submit',e=>{if(e.target.id!=='contact-form')return;e.preventDefault();const f=new FormData(e.target),phone=String(f.get('phone'));if(phone.replace(/\D/g,'').length<10||phone.replace(/\D/g,'').length>15){document.getElementById('contact-error').textContent='Проверьте номер: от 10 до 15 цифр.';return;}person={name:String(f.get('name')).trim(),email:String(f.get('email')).trim(),phone};current='region';go('question');});
const demoBase={region:'ru',city:'Казань',stage:'new',format:'home',product:'Наборы и композиции',goal:'Получать заказы не только от знакомых',channels:['Рекомендации'],change:'no',maps_existing:false,numbers:'unknown',sales:'good',responder:'self',economy:'none',base:'none',restore:'no',avito:'none',vk:'none',ready:'yes',time:'yes',capacity:'room',budget:'yes',budget_amount:5000,currency:'₽',access:'ok',note:''};

function loonsReviews(){return `<div class="loons-reviews"><div class="loons-reviews-track" tabindex="0" role="region" aria-label="Отзывы учениц, листайте влево и вправо">${LOONS_REVIEWS.map((r,i)=>`<article class="loons-review-card"><div class="loons-review-meta"><span class="loons-review-tag">${esc(r.tag)}</span><span class="loons-review-number">${String(i+1).padStart(2,'0')}</span></div><button type="button" class="loons-review-image" data-loons-review="${i}" aria-label="Увеличить отзыв ${i+1}"><img src="${r.image}" loading="lazy" decoding="async" alt="Отзыв ученицы ${i+1}"></button><button type="button" class="loons-review-original" data-loons-review="${i}">Увеличить отзыв <span aria-hidden="true">↗</span></button></article>`).join('')}</div><div class="loons-reviews-controls"><span class="loons-review-count" aria-live="polite">01 / ${LOONS_REVIEWS.length}</span><div class="loons-review-arrows"><button type="button" class="loons-review-arrow" data-loons-step="-1" aria-label="Предыдущий отзыв" disabled>←</button><button type="button" class="loons-review-arrow" data-loons-step="1" aria-label="Следующий отзыв">→</button></div></div></div>`;}
function loonsUpdateReviewTrack(track){const root=track.closest('.loons-reviews'),cards=[...track.children];if(!root||!cards.length)return;const start=cards[0].offsetLeft;let i=0;for(let j=1;j<cards.length;j++){if(Math.abs(cards[j].offsetLeft-start-track.scrollLeft)<Math.abs(cards[i].offsetLeft-start-track.scrollLeft))i=j;}root.querySelector('.loons-review-count').textContent=String(i+1).padStart(2,'0')+' / '+cards.length;root.querySelector('[data-loons-step="-1"]').disabled=track.scrollLeft<=2;root.querySelector('[data-loons-step="1"]').disabled=track.scrollLeft>=track.scrollWidth-track.clientWidth-2;}
function loonsStepReview(track,step){const card=track.firstElementChild;if(!card)return;const gap=parseFloat(getComputedStyle(track).columnGap)||0;track.scrollBy({left:step*(card.getBoundingClientRect().width+gap),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function loonsInitReviews(){app.querySelectorAll('.loons-reviews-track').forEach(track=>{track.addEventListener('scroll',()=>loonsUpdateReviewTrack(track),{passive:true});track.addEventListener('keydown',e=>{if(e.target!==track)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();loonsStepReview(track,e.key==='ArrowRight'?1:-1);}});loonsUpdateReviewTrack(track);});}
app.addEventListener('click',e=>{const arrow=e.target.closest('[data-loons-step]');if(arrow){loonsStepReview(arrow.closest('.loons-reviews').querySelector('.loons-reviews-track'),Number(arrow.dataset.loonsStep));return;}const btn=e.target.closest('[data-loons-review]');if(!btn)return;const r=LOONS_REVIEWS[Number(btn.dataset.loonsReview)],d=document.getElementById('loons-review-dialog');if(!r)return;const im=d.querySelector('img');im.src=r.image;im.alt='Оригинальный скриншот отзыва: '+r.tag;d.showModal();});
const loonsReviewDialog=document.getElementById('loons-review-dialog');loonsReviewDialog.addEventListener('click',e=>{if(e.target===loonsReviewDialog){const b=loonsReviewDialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)loonsReviewDialog.close();}});loonsReviewDialog.addEventListener('close',()=>loonsReviewDialog.querySelector('img').removeAttribute('src'));window.addEventListener('resize',()=>app.querySelectorAll('.loons-reviews-track').forEach(loonsUpdateReviewTrack));
const loonsZoom=loonsReviewDialog.querySelector('.loons-zoom-image'),loonsZoomButton=document.getElementById('loons-review-zoom');
function loonsSetZoom(on){loonsZoom.classList.toggle('zoomed',on);loonsZoomButton.setAttribute('aria-pressed',String(on));loonsZoomButton.textContent=on?'Уменьшить изображение':'Увеличить изображение';if(!on){loonsZoom.scrollLeft=0;loonsZoom.scrollTop=0;}}
loonsZoomButton.addEventListener('click',()=>loonsSetZoom(!loonsZoom.classList.contains('zoomed')));loonsZoom.querySelector('img').addEventListener('click',()=>loonsSetZoom(!loonsZoom.classList.contains('zoomed')));loonsReviewDialog.addEventListener('close',()=>loonsSetZoom(false));
